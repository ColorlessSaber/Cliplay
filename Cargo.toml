[package]
name = "cliplay"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14.0", features = ["tokio", "debug", "time-travel"] }
iced_moving_picture = "0.2.0"
iced_video_player = { version = "0.6.0", optional = true}
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
directories = "6.0.0"
tokio = { version = "1.49.0", features = ["full"] }
gstreamer = {version = "0.24.4", optional = true}
gstreamer-app = {version = "0.24.4", optional = true}